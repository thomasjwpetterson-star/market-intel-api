[project]
name = "mimir-opportunity-engine"
version = "0.5.18"
requires-python = ">=3.9"
dependencies = ["boto3==1.40.52", "duckdb==1.4.2", "beautifulsoup4>=4.12,<5"]
[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]
[tool.setuptools.package-data]
opportunity_engine = ["*.json", "sql/*.sql"]
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["opportunity_engine*"]
