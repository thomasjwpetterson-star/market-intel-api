services:
  - type: web
    name: ask-mimir
    runtime: python
    plan: 1c-2g
    rootDir: ask_mimir_beta
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /api/health
    disk:
      name: ask-mimir-runtime
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: ASK_MIMIR_RUNTIME_ROOT
        value: /var/data/ask-mimir
      - key: ASK_MIMIR_AUDIT_LOG
        value: /var/data/ask-mimir/audit/answers.jsonl
      - key: ASK_MIMIR_BETA_STATE
        value: /var/data/ask-mimir/state/beta-state.sqlite3
      - key: ASK_MIMIR_CACHE_DIR
        value: /var/data/ask-mimir/evidence-cache
      - key: ASK_MIMIR_ALLOW_EXTERNAL_EVIDENCE
        value: "1"
      - key: ASK_MIMIR_ALLOW_TEST_IDENTITIES
        value: "0"
      - key: ASK_MIMIR_STRICT_CITATIONS
        value: "1"
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: OPENAI_REASONING_EFFORT
        value: high
      - key: ASK_MIMIR_MAX_EVIDENCE_RECORDS
        value: "20"
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "10000"
      - key: ASK_MIMIR_UPGRADE_URL
        value: https://www.mimiradvisors.org/dashboard?upgrade=professional
      - key: AWS_REGION
        value: us-east-1
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ASK_MIMIR_CURRENT_MANIFEST_KEY
        value: ask_mimir/runtime/current_manifest.json
      - key: ASK_MIMIR_FOLLOW_CURRENT_RELEASE
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ASK_MIMIR_ANONYMOUS_SALT
        generateValue: true
      - key: ASK_MIMIR_TRUSTED_PROXY_SECRET
        sync: false
  - type: cron
    name: mimir-dod-contract-announcements
    runtime: python
    plan: 0.5c-512mb
    rootDir: ask_mimir_beta
    buildCommand: pip install -r requirements.txt
    startCommand: python refresh_dod_contract_announcements.py --promote --since-days 7 --max-articles 20
    schedule: "30 23 * * *"
    envVars:
      - key: AWS_REGION
        value: us-east-1
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ASK_MIMIR_BUCKET
        value: a-and-d-intel-lake-newaccount
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ASK_MIMIR_RENDER_DEPLOY_HOOK_URL
        sync: false
      - key: MIMIR_API_RENDER_DEPLOY_HOOK_URL
        sync: false
